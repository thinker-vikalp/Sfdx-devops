name: Salesforce Pipeline

run-name: Sandbox Pipeline running

on:
  push:

jobs:
  setup-salesforce:
    name: Setup Salesforce
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
          
      - name: Setup Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Check CLI Version
        run: sf --version

      - name: Install Salesforce Code Analyzer
        run: |
          sf --help
          sf plugins install code-analyzer

      - name: Verify Installed Plugins
        run: sf plugins

      - name: Authenticate with Salesforce
        run: sf org login sfdx-url --sfdx-url-file tmp/authFile.txt --set-default --alias fslSandbox
